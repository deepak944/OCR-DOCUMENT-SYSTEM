services:
  postgres:
    image: postgres:16-alpine
    container_name: ocr-postgres
    environment:
      POSTGRES_DB: ocr_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-ai-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    command: ["sh", "-lc", "unset PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    container_name: ocr-ai-service
    environment:
      - OCR_CPU_THREADS=2
      - OCR_FALLBACK_DPI=200
      - OCR_MAX_SIDE=1600
      - OCR_ENABLE_PREPROCESSING=false
      - OCR_DET_MODEL=PP-OCRv5_mobile_det
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=False
      - FLAGS_use_mkldnn=0
    ports:
      - "8000:8000"
    volumes:
      - paddlex-cache:/root/.paddlex
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=24h
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ocr_system
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DIALECT=postgres
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  paddlex-cache:
