services:
  postgres:
    image: postgres:16-alpine
    container_name: ocr-postgres
    environment:
      POSTGRES_DB: ocr_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-ai-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ocr-ai-service
    environment:
      - OCR_CPU_THREADS=4
      - OCR_FALLBACK_DPI=150
      - OCR_MAX_SIDE=1600
      - OCR_ENABLE_PREPROCESSING=false
      - DISABLE_OCR_FALLBACK=true
      - DISABLE_CAMELOT=true
      - MAX_UPLOAD_BYTES=10485760
      - REDIS_HOST=redis

      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - easyocr-cache:/root/.EasyOCR
      - uploads-data:/app/uploads
    mem_limit: 8g
    memswap_limit: 8g
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  ai-worker:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-ai-worker:${IMAGE_TAG:-latest}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ocr-ai-worker
    command: python -m app.worker
    environment:
      - OCR_CPU_THREADS=4
      - OCR_FALLBACK_DPI=150
      - OCR_MAX_SIDE=1600
      - OCR_ENABLE_PREPROCESSING=false
      - DISABLE_OCR_FALLBACK=true
      - DISABLE_CAMELOT=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://backend:5000
    volumes:
      - easyocr-cache:/root/.EasyOCR
      - uploads-data:/app/uploads
    mem_limit: 8g
    memswap_limit: 8g
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=24h
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ocr_system
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DIALECT=postgres
      - NODE_ENV=production
      - REQUEST_TIMEOUT=1800000
      - OCR_TIMEOUT_MS=1800000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    env_file:
      - ./backend/.env

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
  easyocr-cache:
  redis-data:
  uploads-data:
