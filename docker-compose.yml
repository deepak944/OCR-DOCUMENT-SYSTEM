services:
  postgres:
    image: postgres:16-alpine
    container_name: ocr-postgres
    environment:
      POSTGRES_DB: ocr_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-ai-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ocr-ai-service
    environment:
      - OCR_CPU_THREADS=2
      - OCR_FALLBACK_DPI=150
      - OCR_MAX_SIDE=1600
      - OCR_ENABLE_PREPROCESSING=false
      - MAX_UPLOAD_BYTES=524288000
    ports:
      - "8000:8000"
    volumes:
      - easyocr-cache:/root/.EasyOCR
    mem_limit: 8g
    memswap_limit: 8g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocr-backend
    environment:
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=24h
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ocr_system
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DIALECT=postgres
      - NODE_ENV=production
      - REQUEST_TIMEOUT=1800000
      - OCR_TIMEOUT_MS=1800000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/ocr-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocr-frontend
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  easyocr-cache:
